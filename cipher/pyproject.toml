[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cipher-detect"
version = "1.0.0"
description = "CIPHER: Cognitive Information Pattern Hierarchy for Entropy-based Recognition"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=2.0",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "zstandard>=0.23",
    "networkx>=3.3",
    "pydantic>=2.7",
]

[project.optional-dependencies]
nlp = [
    "spacy>=3.8",
    "sentence-transformers>=3.0",
]
topics = [
    "bertopic>=0.16",
]
coref = [
    "coreferee>=1.4",
]
neural = [
    "torch>=2.3",
    "transformers>=4.41",
]
explain = [
    "shap>=0.46",
    "crepes>=0.7",
]
all = [
    "cipher-detect[nlp,topics,coref,neural,explain]",
]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
cipher = "cipher.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["cipher"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["cipher", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "ANN", "S", "B", "A"]
ignore = ["ANN101", "ANN102"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=cipher --cov-report=term-missing -q"

[tool.coverage.run]
omit = ["cipher/training/*", "tests/*"]
